<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subnet Calculator - Tính toán mạng con</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.8;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }
        .input-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .input-field {
            flex: 1;
            min-width: 200px;
        }
        .input-field label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            opacity: 0.8;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 16px;
            font-family: monospace;
        }
        input:focus {
            outline: none;
            background: rgba(255,255,255,0.25);
        }
        button {
            background: #00ff88;
            color: #1e1e1e;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
        }
        button:hover {
            background: #00cc66;
        }
        .results {
            margin-top: 20px;
        }
        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .result-item {
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 15px;
            border-left: 3px solid #00ff88;
        }
        .result-label {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
        }
        .result-value {
            font-size: 16px;
            font-weight: bold;
            font-family: monospace;
            word-break: break-all;
        }
        .cidr-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .cidr-badge {
            background: rgba(0,255,136,0.2);
            border: 1px solid #00ff88;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 12px;
            font-family: monospace;
            cursor: pointer;
            transition: 0.2s;
        }
        .cidr-badge:hover {
            background: #00ff88;
            color: #1e1e1e;
        }
        .quick-preset {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .preset-btn {
            background: rgba(255,255,255,0.1);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .preset-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        hr {
            border-color: rgba(255,255,255,0.1);
            margin: 15px 0;
        }
        .binary {
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🧮 Subnet Calculator</h1>
        <p>Tính toán địa chỉ mạng, broadcast, dải IP, số host</p>
    </div>

    <div class="card">
        <div class="quick-preset">
            <span style="opacity:0.7;">📌 Mẫu nhanh:</span>
            <span class="preset-btn" data-ip="192.168.1.1" data-mask="24">192.168.1.1/24</span>
            <span class="preset-btn" data-ip="10.0.0.1" data-mask="8">10.0.0.1/8</span>
            <span class="preset-btn" data-ip="172.16.0.1" data-mask="16">172.16.0.1/16</span>
            <span class="preset-btn" data-ip="192.168.0.1" data-mask="26">192.168.0.1/26</span>
            <span class="preset-btn" data-ip="8.8.8.8" data-mask="30">8.8.8.8/30</span>
        </div>

        <div class="input-group">
            <div class="input-field">
                <label>🌐 Địa chỉ IP</label>
                <input type="text" id="ipAddress" placeholder="VD: 192.168.1.1" value="192.168.1.1">
            </div>
            <div class="input-field">
                <label>🔢 Subnet Mask (VD: 24 hoặc 255.255.255.0)</label>
                <input type="text" id="subnetMask" placeholder="VD: 24" value="24">
            </div>
        </div>

        <div class="cidr-list">
            <span style="opacity:0.7;">CIDR nhanh:</span>
            <span class="cidr-badge" data-cidr="8">/8</span>
            <span class="cidr-badge" data-cidr="16">/16</span>
            <span class="cidr-badge" data-cidr="24">/24</span>
            <span class="cidr-badge" data-cidr="25">/25</span>
            <span class="cidr-badge" data-cidr="26">/26</span>
            <span class="cidr-badge" data-cidr="27">/27</span>
            <span class="cidr-badge" data-cidr="28">/28</span>
            <span class="cidr-badge" data-cidr="29">/29</span>
            <span class="cidr-badge" data-cidr="30">/30</span>
        </div>

        <button id="calculateBtn">📊 TÍNH TOÁN</button>

        <div id="results" style="margin-top: 20px;"></div>
    </div>
</div>

<script>
    // Hàm chuyển IP sang số nguyên 32 bit (đã sửa đúng thứ tự)
    function ipToInt(ip) {
        var parts = ip.split('.');
        // (a<<24) | (b<<16) | (c<<8) | d
        return ((parseInt(parts[0]) << 24) | 
                (parseInt(parts[1]) << 16) | 
                (parseInt(parts[2]) << 8) | 
                parseInt(parts[3])) >>> 0;
    }

    // Hàm chuyển số nguyên sang IP
    function intToIp(num) {
        return ((num >>> 24) & 255) + '.' +
               ((num >>> 16) & 255) + '.' +
               ((num >>> 8) & 255) + '.' +
               (num & 255);
    }

    // Hàm tạo mặt nạ từ CIDR
    function cidrToMask(cidr) {
        if (cidr === 0) return 0;
        return (0xFFFFFFFF << (32 - cidr)) >>> 0;
    }

    // Hàm tính CIDR từ mặt nạ
    function maskToCidr(mask) {
        var cidr = 0;
        for (var i = 0; i < 32; i++) {
            if ((mask & (1 << (31 - i))) !== 0) {
                cidr++;
            }
        }
        return cidr;
    }

    // Kiểm tra IP hợp lệ
    function isValidIp(ip) {
        var parts = ip.split('.');
        if (parts.length !== 4) return false;
        for (var i = 0; i < 4; i++) {
            var num = parseInt(parts[i]);
            if (isNaN(num) || num < 0 || num > 255) return false;
        }
        return true;
    }

    // Kiểm tra mặt nạ hợp lệ
    function isValidMask(mask) {
        // Mặt nạ phải có dạng bit 1 liên tiếp từ trái sang
        var binary = mask.toString(2);
        var firstZero = binary.indexOf('0');
        if (firstZero === -1) return true;
        return binary.indexOf('1', firstZero) === -1;
    }

    // Định dạng số nhị phân 8 bit
    function toBinary8(num) {
        var binary = (num & 255).toString(2);
        while (binary.length < 8) binary = '0' + binary;
        return binary;
    }

    function toBinaryIp(ip) {
        var parts = ip.split('.');
        return toBinary8(parseInt(parts[0])) + '.' + 
               toBinary8(parseInt(parts[1])) + '.' + 
               toBinary8(parseInt(parts[2])) + '.' + 
               toBinary8(parseInt(parts[3]));
    }

    function calculate() {
        var ip = document.getElementById('ipAddress').value.trim();
        var maskInput = document.getElementById('subnetMask').value.trim();
        var resultsDiv = document.getElementById('results');

        // Validate IP
        if (!isValidIp(ip)) {
            resultsDiv.innerHTML = '<div style="background:rgba(255,0,0,0.2); padding:15px; border-radius:10px;">❌ IP không hợp lệ! (VD: 192.168.1.1)</div>';
            return;
        }

        // Parse mask
        var maskInt;
        if (maskInput.includes('.')) {
            if (!isValidIp(maskInput)) {
                resultsDiv.innerHTML = '<div style="background:rgba(255,0,0,0.2); padding:15px; border-radius:10px;">❌ Subnet mask không hợp lệ!</div>';
                return;
            }
            maskInt = ipToInt(maskInput);
            if (!isValidMask(maskInt)) {
                resultsDiv.innerHTML = '<div style="background:rgba(255,0,0,0.2); padding:15px; border-radius:10px;">❌ Subnet mask không liên tục!</div>';
                return;
            }
        } else {
            var cidr = parseInt(maskInput);
            if (isNaN(cidr) || cidr < 0 || cidr > 32) {
                resultsDiv.innerHTML = '<div style="background:rgba(255,0,0,0.2); padding:15px; border-radius:10px;">❌ CIDR phải từ 0 đến 32!</div>';
                return;
            }
            maskInt = cidrToMask(cidr);
        }

        var ipInt = ipToInt(ip);
        var networkInt = ipInt & maskInt;
        var broadcastInt = networkInt | (~maskInt >>> 0);
        var cidrValue = maskToCidr(maskInt);
        var maskDecimal = intToIp(maskInt);
        var wildcard = intToIp(~maskInt >>> 0);
        var totalHosts = broadcastInt - networkInt + 1;
        var usableHosts = totalHosts - 2;
        if (cidrValue === 31) usableHosts = 2;
        if (cidrValue === 32) usableHosts = 1;
        
        var firstUsable = networkInt + 1;
        var lastUsable = broadcastInt - 1;

        // Tạo HTML kết quả
        var html = '<hr>';
        html += '<div class="result-grid">';
        html += '<div class="result-item"><div class="result-label">🌐 Địa chỉ mạng (Network)</div><div class="result-value">' + intToIp(networkInt) + '</div></div>';
        html += '<div class="result-item"><div class="result-label">📢 Địa chỉ Broadcast</div><div class="result-value">' + intToIp(broadcastInt) + '</div></div>';
        html += '<div class="result-item"><div class="result-label">🎯 IP đầu tiên (First usable)</div><div class="result-value">' + (cidrValue >= 31 ? 'N/A' : intToIp(firstUsable)) + '</div></div>';
        html += '<div class="result-item"><div class="result-label">🏁 IP cuối cùng (Last usable)</div><div class="result-value">' + (cidrValue >= 31 ? 'N/A' : intToIp(lastUsable)) + '</div></div>';
        html += '<div class="result-item"><div class="result-label">🔢 Subnet Mask</div><div class="result-value">' + maskDecimal + '</div></div>';
        html += '<div class="result-item"><div class="result-label">📏 CIDR</div><div class="result-value">/' + cidrValue + '</div></div>';
        html += '<div class="result-item"><div class="result-label">🔀 Wildcard Mask</div><div class="result-value">' + wildcard + '</div></div>';
        html += '<div class="result-item"><div class="result-label">💻 Tổng số địa chỉ</div><div class="result-value">' + totalHosts.toLocaleString() + '</div></div>';
        html += '<div class="result-item"><div class="result-label">✅ Số host khả dụng</div><div class="result-value">' + usableHosts.toLocaleString() + '</div></div>';
        html += '</div>';
        
        html += '<div class="result-item"><div class="result-label">📋 Dải IP khả dụng</div><div class="result-value">';
        if (cidrValue === 32) {
            html += 'Chỉ có 1 địa chỉ (điểm-điểm)';
        } else if (cidrValue === 31) {
            html += intToIp(networkInt) + ' → ' + intToIp(broadcastInt);
        } else {
            html += intToIp(firstUsable) + ' → ' + intToIp(lastUsable);
        }
        html += '</div></div>';
        
        html += '<div class="result-item"><div class="result-label">💻 Binary - IP</div><div class="binary">' + toBinaryIp(ip) + '</div></div>';
        html += '<div class="result-item"><div class="result-label">💻 Binary - Subnet Mask</div><div class="binary">' + toBinaryIp(maskDecimal) + '</div></div>';
        html += '<div class="result-item"><div class="result-label">💻 Binary - Wildcard</div><div class="binary">' + toBinaryIp(wildcard) + '</div></div>';

        resultsDiv.innerHTML = html;
        resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Gán sự kiện
    document.getElementById('calculateBtn').addEventListener('click', calculate);
    
    document.getElementById('ipAddress').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') calculate();
    });
    document.getElementById('subnetMask').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') calculate();
    });
    
    // CIDR badges
    var badges = document.querySelectorAll('.cidr-badge');
    for (var i = 0; i < badges.length; i++) {
        badges[i].addEventListener('click', function() {
            var cidr = this.getAttribute('data-cidr');
            document.getElementById('subnetMask').value = cidr;
            calculate();
        });
    }
    
    // Preset buttons
    var presets = document.querySelectorAll('.preset-btn');
    for (var i = 0; i < presets.length; i++) {
        presets[i].addEventListener('click', function() {
            var ip = this.getAttribute('data-ip');
            var mask = this.getAttribute('data-mask');
            document.getElementById('ipAddress').value = ip;
            document.getElementById('subnetMask').value = mask;
            calculate();
        });
    }

    // Tự động tính khi load
    calculate();
</script>
</body>
</html>
